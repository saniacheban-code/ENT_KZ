<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тренажер ЕНТ 2.0 — Подготовка по 15 предметам</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f3f5f8;
      color: #1f2937;
      line-height: 1.5;
    }
    .page-wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .site-header {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      cursor: pointer;
    }
    .site-header h1 {
      margin: 0 0 4px;
      font-size: 24px;
      color: #111827;
    }
    .site-header p {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
    }
    .version-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .panel h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }
    .subtitle {
      margin: 0 0 18px;
      color: #6b7280;
      font-size: 14px;
    }
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .subject-card {
      text-align: left;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .subject-card:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .subject-title {
      font-weight: 600;
      font-size: 15px;
      color: #111827;
      margin-bottom: 4px;
    }
    .subject-meta {
      font-size: 12px;
      color: #6b7280;
    }
    .variants-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .bottom-actions {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .quiz-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .question-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      background: #ffffff;
    }
    .question-header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .question-num {
      font-weight: 700;
      color: #2563eb;
    }
    .question-text {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #111827;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
      font-size: 14px;
    }
    .option-item.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .option-item.correct-option {
      border-color: #16a34a;
      background: #dcfce7;
    }
    .option-item.wrong-option {
      border-color: #dc2626;
      background: #fee2e2;
    }
    .option-letter {
      font-weight: 700;
      min-width: 20px;
    }
    .explanation-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .exp-ok {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #14532d;
    }
    .exp-err {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }
    .exp-text {
      margin-top: 6px;
      color: #374151;
    }
    .result-summary {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .result-summary h3 {
      margin: 0 0 8px;
      color: #1e3a8a;
    }
    .result-summary p {
      margin: 0 0 8px;
    }
    .error-text {
      color: #b91c1c;
      font-weight: 600;
    }
    .stats-footer {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 20px;
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .stats-title {
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="site-header" onclick="renderSubjects()">
      <h1>Тренажер ЕНТ 2.0</h1>
      <p>Практические варианты по спецификации НЦТ РК с проверкой ответов и пояснениями</p>
    </header>
    <main id="app"></main>
    <footer class="stats-footer">
      <div class="stats-title">📊 Статистика посещений</div>
      <div class="stats-row">
        <span>Сегодня: <strong id="stat-today">1</strong></span>
        <span>За месяц: <strong id="stat-month">1</strong></span>
        <span>Всего: <strong id="stat-total">1</strong></span>
      </div>
    </footer>
  </div>
  <script src="./registry.js?v=2.0"></script>
  <script src="./app.js?v=2.0"></script>
  <script>
    (function updateVisitStats() {
      try {
        const now = new Date();
        const dayKey = now.toISOString().slice(0, 10);
        const monthKey = now.toISOString().slice(0, 7);
        const raw = localStorage.getItem("ent_trainer_stats_v2");
        const stats = raw ? JSON.parse(raw) : { dayKey, monthKey, today: 0, month: 0, total: 0 };
        if (stats.dayKey !== dayKey) { stats.dayKey = dayKey; stats.today = 0; }
        if (stats.monthKey !== monthKey) { stats.monthKey = monthKey; stats.month = 0; }
        stats.today += 1;
        stats.month += 1;
        stats.total += 1;
        localStorage.setItem("ent_trainer_stats_v2", JSON.stringify(stats));
        document.getElementById("stat-today").textContent = stats.today;
        document.getElementById("stat-month").textContent = stats.month;
        document.getElementById("stat-total").textContent = stats.total;
      } catch (e) {}
    })();
  </script>
</body>
</html>
